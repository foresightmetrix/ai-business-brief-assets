name: Claude PR Review

# Automatic review on every PR open, push, reopen, and draft -> ready.
# Posts one summary comment (updated on each push) plus inline comments.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push supersedes a review still running for the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts and fork PRs (forks get no secrets).
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The review uses this job's own token (github_token below), limited to
    # these permissions. It cannot push code. Comments post as github-actions.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Read,Glob,Grep"
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            PREVIOUS HEAD (synchronize only): ${{ github.event.before }}

            Review this pull request and post the results to GitHub.

            ## 1. Gather context
            - `gh pr view ${{ github.event.pull_request.number }}` for title, description, linked issues.
            - `gh pr diff ${{ github.event.pull_request.number }}` for the full diff.
            - Read the root CLAUDE.md and any CLAUDE.md in directories of changed files. Their rules are this repo's standards.
            - List existing inline review comments:
              `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`
              Never post an issue that an existing comment already raises.
            - If EVENT is `synchronize` and the previous head is reachable, focus on
              `git diff ${{ github.event.before }}..${{ github.event.pull_request.head.sha }}`,
              but still flag anything in the full PR diff that earlier passes missed.

            ## 2. Find issues
            Read surrounding code as needed to confirm each finding. Report only issues in code this PR adds or changes.

            Severity labels:
            - 🔴 **Bug**: wrong results, crash, data loss, security hole, broken build, or a clear CLAUDE.md violation (quote the rule).
            - 🟡 **Risk**: likely problem under realistic inputs: unhandled error path, race, missing validation, performance trap.
            - 🔵 **Nit**: small readability or consistency fix. Post at most 5, and only with a committable suggestion.

            Do not flag: pre-existing issues, things a linter or formatter catches, subjective style, or anything you are not confident is real. Before posting, re-check every finding against the actual code and drop any you cannot confirm. False positives cost more than misses.

            ## 3. Post inline comments
            Use `mcp__github_inline_comment__create_inline_comment` with `confirmed: true`, one comment per issue, starting with the severity label. Include a ```suggestion block only when committing it fully fixes the issue and is under 6 lines.

            ## 4. Post or update the summary comment
            Look for an existing PR comment whose body starts with `<!-- claude-review-summary -->`:
            `gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments --paginate --jq '.[] | select(.body | startswith("<!-- claude-review-summary -->")) | .id'`
            If found, replace its body with `gh api -X PATCH repos/${{ github.repository }}/issues/comments/<id> -f body=...`.
            Otherwise create it with `gh pr comment ${{ github.event.pull_request.number }} --body ...`.

            Summary format:
            ```
            <!-- claude-review-summary -->
            ## Review summary

            **Walkthrough:** 2–4 sentences on what the PR does and why.

            | File(s) | Change |
            |---|---|
            | ... | one line each; group related files |

            **Findings:** 🔴 N · 🟡 N · 🔵 N (new this pass; list each with a one-line link to its inline comment)
            **Verdict:** Looks good to merge / Fix 🔴 items before merging / Needs discussion

            <sub>Reviewed at <short head sha></sub>
            ```
            If there are no findings, say "No issues found." under Findings.

            Use only the gh commands above for GitHub. Do not modify files, push commits, or approve/request changes.
